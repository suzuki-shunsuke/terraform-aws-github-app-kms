---
name: test (workflow_call)
on: workflow_call
jobs:
  # renovate-config-validator, ghalint, and typos
  test-workflow:
    uses: suzuki-shunsuke/test-workflow/.github/workflows/test.yaml@0b89b9b4314282810bc944364380568708208eaa # v0.0.2
    with:
      aqua_version: v2.66.0
    permissions:
      contents: read
      pull-requests: read

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions: {}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.0

      - run: terraform version
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}

      - run: terraform init
        working-directory: test

      - run: terraform validate
        working-directory: test
