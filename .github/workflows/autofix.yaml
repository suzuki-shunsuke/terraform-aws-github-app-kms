---
name: autofix.ci
on: pull_request
permissions: {}
jobs:
  autofix:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.0

      # aqua-checksums.json
      - run: aqua upc -prune
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}

      # Newlines
      - run: nllint -v
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}
      - run: git ls-files | xargs nllint -f -s
        shell: bash

      - run: terraform-docs --version
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}

      - run: terraform-docs .

      - uses: autofix-ci/action@v1.3.4
